<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Copycat</title>
    <!--
      Strict CSP: no remote content, no inline scripts, no eval, no network.
      style-src needs 'unsafe-inline' only because Vite injects <style> tags during dev HMR;
      the production build emits a .css file.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
