appId: com.copycat.app
productName: Copycat
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!website/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Tray icons are loaded from disk at runtime, so keep them outside the asar archive.
asarUnpack:
  - resources/**
win:
  executableName: copycat
  icon: build/icon.ico
  # x64 covers most PCs (and runs emulated on Windows on ARM).
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: false
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # One dmg per architecture: Apple silicon and Intel.
  target:
    - target: dmg
      arch: [arm64, x64]
  # No Developer ID certificate yet, so sign ad-hoc ("-"). Without any signature, the bundle
  # keeps only the Electron binary's linker signature, which no longer matches once our files
  # are added: macOS then calls the downloaded app "damaged" and offers no way to open it.
  # Ad-hoc signed, it is an "unidentified developer" app that users can allow once in
  # System Settings → Privacy & Security.
  identity: '-'
  # Hardened runtime is only needed for notarization (which needs a real certificate), and
  # with ad-hoc signing it rejects Electron's pre-signed frameworks at launch. Turn it back on
  # together with a Developer ID identity and notarization.
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu bar only: no Dock icon, no app menu.
    LSUIElement: true
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
