appId: com.copycat.app
productName: Copycat
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Tray icons are loaded from disk at runtime, so keep them outside the asar archive.
asarUnpack:
  - resources/**
win:
  executableName: copycat
  icon: build/icon.ico
  # x64 covers most PCs (and runs emulated on Windows on ARM).
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: false
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # One dmg per architecture: Apple silicon and Intel.
  target:
    - target: dmg
      arch: [arm64, x64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu bar only: no Dock icon, no app menu.
    LSUIElement: true
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
